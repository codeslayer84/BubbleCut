name: Release

# Windows bundles cannot be produced on macOS — Tauri needs MSVC and WebView2
# on an actual Windows machine — so each platform builds on its own runner.
#
# The release is created once, up front, and every platform uploads into it by
# id. Letting the matrix jobs each create the release races: two of them find
# no release for the tag, both make one, and the artifacts end up split across
# two drafts.
#
# The source repo is private; the builds are not. Everything is built here and
# the artifacts are pushed to a separate public repo (BUILDS_REPO) whose only
# contents are releases, so a download link can be shared without the source.
# That needs a BUILDS_TOKEN secret: a fine-grained PAT with Contents:
# read+write on the builds repo only. Without it the workflow stops before
# building rather than quietly publishing nowhere.
#
# Push a tag to publish:
#   git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  # Public, releases only. Change here if it is ever renamed.
  BUILDS_REPO: codeslayer84/bubblecut-builds

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.result }}
      can_sign_mac: ${{ steps.signing.outputs.mac }}
    steps:
      - uses: actions/checkout@v4

      # Fail here rather than after a 20-minute matrix build.
      - name: Check the builds-repo token is present
        env:
          BUILDS_TOKEN: ${{ secrets.BUILDS_TOKEN }}
        run: |
          if [ -z "$BUILDS_TOKEN" ]; then
            echo "::error::No BUILDS_TOKEN secret. Add a fine-grained PAT with Contents: read+write on $BUILDS_REPO."
            exit 1
          fi

      # An unsigned macOS build is worse than none: it overwrites a notarised
      # one uploaded by hand, and anyone downloading it meets Gatekeeper.
      - name: Can macOS be signed here?
        id: signing
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          if [ -n "$CERT" ]; then
            echo "mac=true" >> "$GITHUB_OUTPUT"
          else
            echo "mac=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No APPLE_CERTIFICATE secret, so the macOS build is skipped. Build and notarize it locally with scripts/build-signed.sh."
          fi

      - name: Create the draft release
        id: create
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.BUILDS_TOKEN }}
          script: |
            const [owner, repo] = process.env.BUILDS_REPO.split('/');
            const tag = context.ref.replace('refs/tags/', '');
            const body = [
              'Desktop builds of Bubblecut.',
              '',
              '**FFmpeg is required and is not bundled.** Install it before running:',
              '',
              '- macOS: `brew install ffmpeg`',
              '- Windows: `winget install Gyan.FFmpeg`',
              '',
              'The app checks on startup and shows the command for your platform if it',
              'cannot find FFmpeg. On Apple silicon use a native arm64 build: an Intel',
              'build under Rosetta cannot reach the hardware video encoder and exports',
              'roughly 20x slower.',
              '',
              '### macOS',
              '`Bubblecut_*_aarch64.dmg` — Apple silicon.',
              '',
              'The build is signed but not notarised, so macOS blocks it on first launch',
              'with "Apple could not verify Bubblecut is free of malware". Either:',
              '',
              '**System Settings** → **Privacy & Security** → scroll to the message about',
              'Bubblecut → **Open Anyway**, then confirm and open the app again.',
              '',
              'Or from a terminal:',
              '',
              '```',
              'xattr -dr com.apple.quarantine /Applications/Bubblecut.app',
              '```',
              '',
              'Control-clicking and choosing Open no longer works: Apple removed that',
              'bypass for unnotarised apps in macOS 15.',
              '',
              '### Windows',
              '`Bubblecut_*_x64-setup.exe` (installer) or `Bubblecut_*_x64_en-US.msi`.',
            ].join('\n');

            // Reuse the release if the tag was pushed before, rather than
            // making a second one.
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data;
            } catch (e) {
              release = (await github.rest.repos.createRelease({
                owner, repo,
                tag_name: tag, name: `Bubblecut ${tag.replace(/^v/, '')}`,
                body, draft: true, prerelease: false,
              })).data;
            }
            return release.id;
          result-encoding: string

  build:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            rust-targets: "aarch64-apple-darwin"
            name: "macOS (Apple silicon)"
          - platform: windows-latest
            args: ""
            rust-targets: ""
            name: "Windows"

    runs-on: ${{ matrix.platform }}
    name: ${{ matrix.name }}
    # Skip macOS entirely rather than publish an unsigned build over a good one.
    if: >-
      matrix.platform != 'macos-latest' ||
      needs.create-release.outputs.can_sign_mac == 'true' 

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Signing credentials are only put into the environment when they
      # actually exist. Passing them through unconditionally sets them to the
      # empty string, and Tauri treats "set but empty" as "sign this", then
      # fails importing a certificate that is not there:
      #   security: SecKeychainItemImport: ... parameters ... were not valid
      - name: Enable signing if the secrets are set
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          carry() {
            local name=$1 value=${2-}
            [ -n "$value" ] || return 0
            {
              echo "$name<<__EOF_SECRET__"
              echo "$value"
              echo "__EOF_SECRET__"
            } >> "$GITHUB_ENV"
            echo "signing: $name is set"
          }
          carry APPLE_CERTIFICATE "$APPLE_CERTIFICATE"
          carry APPLE_CERTIFICATE_PASSWORD "$APPLE_CERTIFICATE_PASSWORD"
          carry APPLE_SIGNING_IDENTITY "$APPLE_SIGNING_IDENTITY"
          carry APPLE_API_ISSUER "$APPLE_API_ISSUER"
          carry APPLE_API_KEY "$APPLE_API_KEY"
          carry APPLE_API_KEY_PATH "$APPLE_API_KEY_PATH"
          carry APPLE_ID "$APPLE_ID"
          carry APPLE_PASSWORD "$APPLE_PASSWORD"
          carry APPLE_TEAM_ID "$APPLE_TEAM_ID"
          carry WINDOWS_CERTIFICATE "$WINDOWS_CERTIFICATE"
          carry WINDOWS_CERTIFICATE_PASSWORD "$WINDOWS_CERTIFICATE_PASSWORD"
          echo "Anything not listed above is unset, so that part stays ad-hoc signed."

      # tauri-action uploads only into the repo it runs in, and that repo is
      # the private one, so it just builds here.
      - name: Build
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}

      - name: Upload the bundles to the public builds repo
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.BUILDS_TOKEN }}
          ARTIFACTS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          # artifactPaths is a JSON array of absolute paths. jq is on all three
          # runner images; xargs -a/-d are GNU-only, so loop instead.
          echo "$ARTIFACTS" | jq -r '.[]' > paths.txt
          if [ ! -s paths.txt ]; then
            echo "::error::tauri-action produced no artifacts"
            exit 1
          fi
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            echo "uploading $(basename "$f")"
            # --clobber so re-running a tag replaces rather than errors.
            gh release upload "$tag" "$f" --repo "$BUILDS_REPO" --clobber
          done < paths.txt

  publish-release:
    needs: [create-release, build]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Publish once every platform has uploaded
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.BUILDS_TOKEN }}
          script: |
            const [owner, repo] = process.env.BUILDS_REPO.split('/');
            await github.rest.repos.updateRelease({
              owner, repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false,
            });
