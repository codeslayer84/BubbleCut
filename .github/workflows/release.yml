name: Release

# Windows bundles cannot be produced on macOS — Tauri needs MSVC and WebView2
# on an actual Windows machine — so each platform builds on its own runner.
#
# The release is created once, up front, and every platform uploads into it by
# id. Letting the matrix jobs each create the release races: two of them find
# no release for the tag, both make one, and the artifacts end up split across
# two drafts.
#
# Push a tag to publish:
#   git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - name: Create the draft release
        id: create
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const body = [
              'Desktop builds of Bubblecut.',
              '',
              '**FFmpeg is required and is not bundled.** Install it before running:',
              '',
              '- macOS: `brew install ffmpeg`',
              '- Windows: `winget install Gyan.FFmpeg`',
              '',
              'The app checks on startup and shows the command for your platform if it',
              'cannot find FFmpeg. On Apple silicon use a native arm64 build: an Intel',
              'build under Rosetta cannot reach the hardware video encoder and exports',
              'roughly 20x slower.',
              '',
              '### macOS',
              '`Bubblecut_*_aarch64.dmg` — Apple silicon. The build is unsigned, so the',
              'first launch needs right-click → Open, or:',
              '`xattr -dr com.apple.quarantine "/Applications/Bubblecut.app"`',
              '',
              '### Windows',
              '`Bubblecut_*_x64-setup.exe` (installer) or `Bubblecut_*_x64_en-US.msi`.',
            ].join('\n');

            // Reuse the release if the tag was pushed before, rather than
            // making a second one.
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner, repo: context.repo.repo, tag,
              })).data;
            } catch (e) {
              release = (await github.rest.repos.createRelease({
                owner: context.repo.owner, repo: context.repo.repo,
                tag_name: tag, name: `Bubblecut ${tag.replace(/^v/, '')}`,
                body, draft: true, prerelease: false,
              })).data;
            }
            return release.id;
          result-encoding: string

  build:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            rust-targets: "aarch64-apple-darwin"
            name: "macOS (Apple silicon)"
          - platform: windows-latest
            args: ""
            rust-targets: ""
            name: "Windows"

    runs-on: ${{ matrix.platform }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Signing credentials are only put into the environment when they
      # actually exist. Passing them through unconditionally sets them to the
      # empty string, and Tauri treats "set but empty" as "sign this", then
      # fails importing a certificate that is not there:
      #   security: SecKeychainItemImport: ... parameters ... were not valid
      - name: Enable signing if the secrets are set
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          carry() {
            local name=$1 value=${2-}
            [ -n "$value" ] || return 0
            {
              echo "$name<<__EOF_SECRET__"
              echo "$value"
              echo "__EOF_SECRET__"
            } >> "$GITHUB_ENV"
            echo "signing: $name is set"
          }
          carry APPLE_CERTIFICATE "$APPLE_CERTIFICATE"
          carry APPLE_CERTIFICATE_PASSWORD "$APPLE_CERTIFICATE_PASSWORD"
          carry APPLE_SIGNING_IDENTITY "$APPLE_SIGNING_IDENTITY"
          carry APPLE_API_ISSUER "$APPLE_API_ISSUER"
          carry APPLE_API_KEY "$APPLE_API_KEY"
          carry WINDOWS_CERTIFICATE "$WINDOWS_CERTIFICATE"
          carry WINDOWS_CERTIFICATE_PASSWORD "$WINDOWS_CERTIFICATE_PASSWORD"
          echo "Anything not listed above is unset, so that part stays ad-hoc signed."

      - name: Build and upload into the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

  publish-release:
    needs: [create-release, build]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Publish once every platform has uploaded
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false,
            });
